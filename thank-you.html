<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Maxsus taklif — Vision School</title>
  <link rel="icon" type="image/jpeg" href="assets/vision-logo.jpg">
  <link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body class="video-body">
  <main class="video-page">
    <div class="brand video-brand" aria-label="Vision School"><img src="assets/vision-logo.jpg" alt=""><span>Vision School</span></div>
    <h1>Videoda berilgan maxsus taklifni qo‘lga kiritish uchun oxirigacha ko‘ring!</h1>
    <div class="player-frame"><div id="youtubePlayer"></div></div>
    <section class="watch-gate" id="watchGate">
      <p>Maxsus tugma videoni 13 daqiqa ko‘rganingizdan keyin chiqadi.</p>
      <div class="watch-progress" aria-label="Video ko‘rish jarayoni"><span id="watchProgressBar"></span></div>
      <p class="watch-time" id="watchTime">Qoldi: 13:00</p>
    </section>
    <button class="register-button" id="openAmoForm" type="button" hidden>RO‘YXATDAN O‘TISH</button>
  </main>

  <dialog id="amoLeadDialog" aria-labelledby="amoFormTitle">
    <form id="amoLeadForm" method="dialog">
      <button class="close" type="button" id="closeAmoForm" aria-label="Yopish">×</button>
      <div class="brand form-brand" aria-label="Vision School"><img src="assets/vision-logo.jpg" alt=""><span>Vision School</span></div>
      <h2 id="amoFormTitle">Maxsus taklifga ro‘yxatdan o‘ting</h2>
      <p>Ismingiz va telefon raqamingizni kiriting.</p>
      <label for="amoName">Ismingiz</label>
      <input id="amoName" name="name" type="text" autocomplete="name" placeholder="Ismingiz" required minlength="2">
      <label for="amoPhone">Telefon raqamingiz</label>
      <input id="amoPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" value="+998 " required pattern="\+998 [0-9]{9}" minlength="14" maxlength="14">
      <button class="submit" id="amoSubmitButton" type="submit">RO‘YXATDAN O‘TISH</button>
      <p class="status" id="amoFormStatus" role="status" aria-live="polite"></p>
    </form>
  </dialog>

  <script src="assets/config.js?v=7"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="assets/thank-you.js?v=8"></script>
</body>
</html>
