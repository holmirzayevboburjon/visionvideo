<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="15 daqiqada IELTS Speakingdan yuqori ball olish texnikasi">
  <title>Vision School — IELTS Speaking</title>
  <link rel="icon" type="image/jpeg" href="assets/vision-logo.jpg"><link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
  <main class="page">
    <div class="brand" aria-label="Vision School"><img src="assets/vision-logo.jpg" alt=""><span>Vision School</span></div>
    <h1><span class="headline-accent">15 DAQIQADA</span> IELTS<br>SPEAKINGDAN <span class="headline-accent">YUQORI BALL</span><br>OLISH TEXNIKASINI O‘RGANING!</h1>
    <section class="visual" aria-label="IELTS Speaking darsi">
      <div class="ielts-icon icon-mic" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="23" y="8" width="18" height="31" rx="9"/><path d="M16 31a16 16 0 0 0 32 0M32 47v10M23 57h18"/></svg></div>
      <div class="ielts-icon icon-headphones" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M10 35V29a22 22 0 0 1 44 0v6"/><rect x="7" y="33" width="13" height="22" rx="5"/><rect x="44" y="33" width="13" height="22" rx="5"/></svg></div>
      <div class="ielts-icon icon-chat" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M9 12h46v34H29L17 56V46H9z"/><circle cx="22" cy="29" r="3"/><circle cx="32" cy="29" r="3"/><circle cx="42" cy="29" r="3"/></svg></div>
      <img class="teacher" src="assets/teacher.webp" width="600" height="490" alt="Vision School o‘qituvchisi planshet bilan">
    </section>
    <button class="cta" type="button" id="openForm">DARSNI KO‘RISH</button>
    <p class="offer">IELTS Speaking’dan yuqori ball olishni istasangiz, ushbu videoni hoziroq ko‘ring!</p>
  </main>
  <dialog id="leadDialog" aria-labelledby="formTitle"><form id="leadForm" method="dialog">
    <button class="close" type="button" id="closeForm" aria-label="Yopish">×</button>
    <div class="brand form-brand" aria-label="Vision School"><img src="assets/vision-logo.jpg" alt=""><span>Vision School</span></div>
    <h2 id="formTitle">Bepul darsni oling</h2><p>Ismingiz va telefon raqamingizni kiriting.</p>
    <label for="name">Ismingiz</label><input id="name" name="name" type="text" autocomplete="name" placeholder="Ismingiz" required minlength="2">
    <label for="phone">Telefon raqamingiz</label><input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" value="+998 " required pattern="\+998 [0-9]{9}" minlength="14" maxlength="14">
    <button class="submit" id="submitButton" type="submit">DARSNI OLISH</button><p class="status" id="formStatus" role="status" aria-live="polite"></p>
  </form></dialog>
  <script src="assets/config.js?v=5"></script><script src="assets/app.js?v=8"></script>
</body></html>
